trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.6.6'
  environment: 'dev'
  tfvarsFile: 'envs/$(environment).tfvars'

stages:
# ---------------------------
# CI - Terraform Plan
# ---------------------------
- stage: Terraform_Plan
  displayName: "Terraform Plan"
  jobs:
  - job: Plan
    displayName: "Terraform Plan Job"
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraformVersion)

    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'azure-service-connection'
        backendAzureRmResourceGroupName: 'tf-backend-rg'
        backendAzureRmStorageAccountName: 'tfbackendstorage'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: '$(environment).tfstate'

    - task: TerraformTaskV4@4
      displayName: "Terraform Validate"
      inputs:
        provider: 'azurerm'
        command: 'validate'

    - task: TerraformTaskV4@4
      displayName: "Terraform Plan"
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'azure-service-connection'
        commandOptions: '-var-file=$(tfvarsFile)'
        publishPlanResults: true

# ---------------------------
# CD - Terraform Apply
# ---------------------------
- stage: Terraform_Apply
  displayName: "Terraform Apply"
  dependsOn: Terraform_Plan
  condition: succeeded()

  jobs:
  - deployment: Apply
    displayName: "Terraform Apply Deployment"
    environment: 'prod'   # Enables approvals
    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'azure-service-connection'
              backendAzureRmResourceGroupName: 'tf-backend-rg'
              backendAzureRmStorageAccountName: 'tfbackendstorage'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: '$(environment).tfstate'

          - task: TerraformTaskV4@4
            displayName: "Terraform Apply"
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'azure-service-connection'
              commandOptions: '-auto-approve -var-file=$(tfvarsFile)'
